server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/storage
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

file:
  storage:
    path: /file-storage/uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always